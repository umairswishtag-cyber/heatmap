limit_req_zone $binary_remote_addr zone=graphql:10m rate=20r/s;

server {
    listen 80;
    client_max_body_size 6m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_upstream api:8000;
    set $dashboard_upstream dashboard:3000;

    location = /tracker.js {
        alias /srv/tracker/tracker.iife.js;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    location /graphql {
        limit_req zone=graphql burst=40 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_upstream;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$dashboard_upstream;
    }
}
